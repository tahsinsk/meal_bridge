name: meal_bridge
description: "A local-first Flutter meal planner, recipe manager, and shopping list app."
publish_to: 'none'

version: 0.5.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  share_plus: ^11.0.0
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#2E7D32"
  image: assets/images/logo_mark_white.png
  color_dark: "#2E7D32"
  image_dark: assets/images/logo_mark_white.png
  android_12:
    image: assets/images/logo_mark_white.png
    color: "#2E7D32"
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/